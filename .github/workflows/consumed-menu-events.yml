name: Consumed menu events

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-menu:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Require a single consumed down/up pair without replay
        run: python3 NativeTests/ConsumedMenuEvents/run.py
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumed-menu-events
          path: |
            ${{ runner.temp }}/gancho-shortcut-menu.*/build.log
            ${{ runner.temp }}/gancho-shortcut-menu.*/native-menu.log
            ${{ runner.temp }}/gancho-shortcut-menu.*/summary.json
            ${{ runner.temp }}/gancho-shortcut-menu.*/manifest.json
            ${{ runner.temp }}/gancho-shortcut-menu.*/snapshot.json
          retention-days: 7
